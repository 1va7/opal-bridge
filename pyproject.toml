[project]
name = "agent-bridge"
version = "0.1.0"
description = "Cross-agent session translator (Claude Code ↔ Codex CLI)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
]

[project.scripts]
agent-resume = "agent_bridge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bridge"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
